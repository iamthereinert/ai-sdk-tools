name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "packages/store/**"
      - "packages/devtools/**"
      - "packages/artifacts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Website (static export)
        working-directory: apps/website
        env:
          DEPLOY_TARGET: github-pages
        run: bun run build

      # Publishes apps/website/out to the gh-pages branch. This avoids the
      # Pages REST API entirely (POST /repos/{owner}/{repo}/pages), which
      # requires repo admin rights the default GITHUB_TOKEN doesn't have
      # and fails with "Resource not accessible by integration" the first
      # time a repo's Pages site is created via "GitHub Actions" source.
      # A branch push only needs `contents: write`, which GITHUB_TOKEN has.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/website/out
